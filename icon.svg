<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#152438"/>
      <stop offset="60%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>

    <!-- Neon Emerald to Cyan Flow Gradient -->
    <linearGradient id="neonEmeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2d4a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e1726" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border Accent -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#neonEmeraldCyan)" stroke-width="2" opacity="0.35"/>

  <!-- Radial Atmosphere Glow -->
  <circle cx="256" cy="220" r="150" fill="url(#neonEmeraldCyan)" opacity="0.16" filter="url(#glowEffect)"/>

  <!-- Core Emblem: Stylized Modern Dynamic Diamond-Shield (FinFlow "F" & Upward Prosperity Vault) -->
  <!-- Back Shield Layer -->
  <path d="M 256 86
           C 340 86 404 136 404 220
           C 404 326 296 398 256 426
           C 216 398 108 326 108 220
           C 108 136 172 86 256 86 Z"
        fill="url(#cardSurface)"
        stroke="rgba(255, 255, 255, 0.12)"
        stroke-width="5"/>

  <!-- Flowing Geometric Ribbon (Dynamic F Monogram) -->
  <!-- Top Horizontal Bar -->
  <path d="M 175 160
           L 335 160
           C 355 160 365 174 365 190
           C 365 206 355 220 335 220
           L 230 220
           L 230 250
           L 305 250
           C 322 250 332 262 332 276
           C 332 290 322 302 305 302
           L 230 302
           L 230 358
           C 230 376 216 388 198 388
           C 180 388 166 376 166 358
           L 166 182
           C 166 170 171 160 175 160 Z"
        fill="url(#neonEmeraldCyan)"
        filter="url(#glowEffect)"/>

  <!-- Upward Trend Diamond Peak -->
  <polygon points="340,118 368,146 340,174 312,146" fill="url(#goldAccent)"/>
  
  <!-- Subtle Dynamic Energy Pulse -->
  <path d="M 190 280 L 256 340 L 340 250" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="340" cy="250" r="8" fill="#ffffff"/>
</svg>
